<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>MARSWALK — 복귀선(walk-back)</title>
<style>
  body{margin:0;background:#0d0d14;color:#eee;font-family:sans-serif;padding:16px;max-width:520px;margin:auto}
  h2{margin:0 0 4px} .sub{color:#888;font-size:12px;margin-bottom:14px;line-height:1.5}
  .ctl label{display:block;margin:9px 0 2px;color:#aaa;font-size:13px}
  input[type=range]{width:100%}
  .bar{height:18px;border-radius:5px;background:#222;overflow:hidden;margin:3px 0 10px}
  .fill{height:100%;transition:width .3s,background .3s}
  .stat{display:flex;justify-content:space-between;font-size:14px;margin:4px 0}
  .big{font-size:20px;font-weight:700}
  .warn{color:#ff6b6b;font-weight:700;min-height:18px}
  hr{border-color:#222}
  button{background:#2b6;border:0;color:#042;font-weight:700;padding:8px 18px;border-radius:6px;cursor:pointer;margin:8px 4px 8px 0}
  button.pause{background:#c54;color:#fff}
  #wb{border:2px solid #333;border-radius:10px;padding:12px;margin:12px 0;text-align:center}
  #wbStatus{font-size:26px;font-weight:800;margin:4px 0}
</style>
</head>
<body>
<h2>🧑‍🚀 복귀선 (walk-back)</h2>
<div class="sub">핵심 지표 = <b>산소 %가 아니라 "복귀 여유"</b> · 대사율은 Pandolf 방정식(NASA EVA 모델)</div>

<div class="ctl">
  <label>기지까지 거리: <span id="distV">800</span> m</label>
  <input type="range" id="dist" min="0" max="3000" value="800" step="50">
  <label>지형 경사(갈 때 오르막): <span id="slopeV">8</span>° (grade <span id="gradeV">–</span>%)</label>
  <input type="range" id="slope" min="0" max="25" value="8">
  <label>적재 무게: <span id="loadV">20</span> kg</label>
  <input type="range" id="load" min="0" max="50" value="20">
  <label>보행 속도: <span id="speedV">0.9</span> m/s</label>
  <input type="range" id="speed" min="40" max="150" value="90">
  <label>고도(상대): <span id="elevV">0</span> m · 차폐: <span id="shieldV">0</span>%</label>
  <input type="range" id="elev" min="-2000" max="2000" value="0" step="100">
  <input type="range" id="shield" min="0" max="100" value="0">
  <label><input type="checkbox" id="solar"> ☀️ 태양풍 이벤트</label>
</div>

<button id="go">▶ EVA 시작</button>
<button id="reset" class="pause">⟳ 리셋</button>
<span id="clock" style="color:#888">T+00:00</span>

<!-- 복귀선 핵심 블록 -->
<div id="wb">
  <div id="wbStatus">–</div>
  <div style="font-size:13px;color:#aaa">
    기지까지 <b id="distShow">–</b>m · 복귀 가능 반경 <b id="radius">–</b>m<br>
    복귀하면 산소 <b id="afterReturn">–</b>% 남음
  </div>
</div>

<hr>
<div class="stat">🫙 산소통 <span id="o2pct">100</span>%</div>
<div class="bar"><div class="fill" id="o2bar" style="width:100%;background:#4af"></div></div>
<div class="stat">💪 체력 <span id="stamV">100</span>%</div>
<div class="bar"><div class="fill" id="stambar" style="width:100%;background:#6c6"></div></div>
<div class="stat">☢️ 누적 피폭 <span id="dose">0.00</span> mSv</div>
<div class="bar"><div class="fill" id="dosebar" style="width:0%;background:#fa3"></div></div>
<div class="stat">❤️ 심박 <span id="hr">–</span> bpm | 🔥 <span id="met">–</span> kcal/hr</div>
<div class="warn" id="warn"></div>

<script>
  const M_BODY=80, VO2PEAK=37.5, VO2ABS=VO2PEAK*M_BODY/1000; // 3.0 L/min
  const ETA=2.0, GMARS=0.38, O2_PER_W=1/348, W_KCALH=0.86;
  const SUSTAIN=0.35, HR_REST=70, HRMAX=220-34;
  const TANK_L=500, RAD_DAY=0.64, SPE_RATE=1.2/60, DOSE_LIMIT=2.0;
  const SAFETY=1.2;            // 복귀 산소 20% 안전여유

  let o2=TANK_L, stam=100, dose=0, t=0, timer=null;
  const dtMin=3;

  // Pandolf 대사율(와트) → 주어진 grade에서
  function pandolf(L,v,G){
    const t1=1.5*M_BODY, t2=2.0*(M_BODY+L)*Math.pow(L/M_BODY,2);
    const t3=ETA*(M_BODY+L)*(1.5*v*v + 0.35*v*G*GMARS);
    return t1+t2+t3;
  }

  function step(){
    const dist=+el('dist').value, slopeDeg=+el('slope').value, L=+el('load').value;
    const v=+el('speed').value/100, elev=+el('elev').value, shield=+el('shield').value/100, solar=el('solar').checked;
    const G=Math.tan(slopeDeg*Math.PI/180)*100;

    // 현재(전진) 대사율
    let MW=pandolf(L,v,G); if(stam<30) MW*=1.05;
    const o2rate=MW*O2_PER_W, met=Math.round(MW*W_KCALH), pctVO2=o2rate/VO2ABS;
    let hr=Math.min(Math.round(HR_REST+(HRMAX-HR_REST)*pctVO2+(solar?10:0)),HRMAX);

    // 복귀(내리막) 대사율 — 하향은 평지로 보수 추정(grade=0)
    const o2ReturnRate=pandolf(L,v,0)*O2_PER_W;

    // ── 복귀선 계산 ──
    const returnMin=dist/(v*60);                       // 복귀 소요(분)
    const o2NeedReturn=o2ReturnRate*returnMin*SAFETY;  // 복귀 필요 산소(L)
    const radius=Math.round(o2/(o2ReturnRate*SAFETY)*(v*60)); // 복귀 가능 반경(m)
    const afterReturn=Math.max(0,Math.round((o2-o2NeedReturn)/TANK_L*100)); // 복귀 후 잔여%

    // 피폭
    const altF=1+elev/5000, shF=1-0.2*shield;
    let doseRate=(RAD_DAY/1440)*altF*shF; if(solar) doseRate+=SPE_RATE*shF;

    // 자원 깎기
    o2-=o2rate*dtMin; dose+=doseRate*dtMin;
    stam+=(pctVO2>SUSTAIN?-14*(pctVO2-SUSTAIN):8*(SUSTAIN-pctVO2))*dtMin/3;
    stam=Math.min(Math.max(stam,0),100); t+=dtMin;
    if(o2<=0){o2=0;stop();}

    // 복귀 상태 판정
    let status,color;
    if(dist>radius){ status='🔴 지금 복귀!'; color='#e55'; }
    else if(dist>radius*0.8){ status='🟡 복귀선 근접'; color='#fb3'; }
    else { status='🟢 여유'; color='#5c6'; }
    set('wbStatus',status); el('wbStatus').style.color=color;
    el('wb').style.borderColor=color;
    set('distShow',dist); set('radius',radius); set('afterReturn',dist>radius?0:afterReturn);

    // 자원 화면
    const o2pct=Math.round(o2/TANK_L*100);
    set('o2pct',o2pct); set('stamV',Math.round(stam)); set('dose',dose.toFixed(2));
    set('hr',hr); set('met',met); set('gradeV',G.toFixed(0));
    bar('o2bar',o2pct,o2pct<25?'#e55':'#4af'); bar('stambar',stam,stam<25?'#e55':'#6c6');
    bar('dosebar',Math.min(dose/DOSE_LIMIT*100,100),dose>=1?'#e55':'#fa3');
    el('clock').textContent='T+'+String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
    const w=[]; if(dist>radius)w.push('복귀 불가 임박'); if(hr>=160)w.push('심박 과부하');
    if(stam<25)w.push('탈진'); if(dose>=1)w.push('피폭 경고');
    el('warn').textContent=w.length?'⚠ '+w.join(' · '):'';
    set('distV',dist); set('slopeV',slopeDeg); set('loadV',L); set('speedV',v.toFixed(1));
    set('elevV',elev); set('shieldV',Math.round(shield*100));
  }
  function el(i){return document.getElementById(i)}
  function set(i,v){el(i).textContent=v}
  function bar(i,p,c){el(i).style.width=p+'%';el(i).style.background=c}
  function stop(){clearInterval(timer);timer=null;el('go').textContent='▶ 재개';el('go').classList.remove('pause')}
  el('go').onclick=()=>{ if(timer){stop();} else {timer=setInterval(step,700);el('go').textContent='⏸ 일시정지';el('go').classList.add('pause');} };
  el('reset').onclick=()=>{stop();o2=TANK_L;stam=100;dose=0;t=0;step();};
  ['dist','slope','load','speed','elev','shield','solar'].forEach(id=>el(id).addEventListener('input',()=>{if(!timer)step()}));
  step();
</script>
</body>
</html>

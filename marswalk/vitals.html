<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>MARSWALK — 환경→생체 연결</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
  html,body{height:100%;margin:0;font-family:sans-serif}
  #map{height:100%}
  #panel{position:absolute;top:12px;right:12px;z-index:1000;background:rgba(20,20,28,.92);
         color:#eee;padding:14px 16px;border-radius:10px;width:250px;font-size:13px}
  #panel h3{margin:0 0 8px;font-size:14px}
  #panel label{display:block;margin:8px 0 2px;color:#aaa}
  #panel input[type=range]{width:100%}
  .big{font-size:22px;font-weight:700}
  .row{display:flex;justify-content:space-between;margin:4px 0}
  .warn{color:#ff6b6b;font-weight:700;min-height:18px;margin-top:8px}
  .ok{color:#51cf66}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h3>🧑‍🚀 환경 → 생체</h3>

  <label>지형 경사: <span id="slopeV">10</span>°</label>
  <input type="range" id="slope" min="0" max="30" value="10">

  <label>적재 무게: <span id="loadV">20</span> kg</label>
  <input type="range" id="load" min="0" max="50" value="20">

  <label>경과 시간: <span id="elapV">120</span> 분</label>
  <input type="range" id="elap" min="0" max="480" value="120">

  <label><input type="checkbox" id="solar"> ☀️ 태양풍 이벤트</label>

  <hr style="border-color:#333;margin:12px 0">
  <div class="row">심박 <span class="big" id="hr">–</span> bpm</div>
  <div class="row">산소 소모 <span id="o2">–</span> L/분</div>
  <div class="row">누적 피폭 <span id="dose">–</span> mSv</div>
  <div class="warn" id="warn"></div>
</div>

<script>
  // ── 지도 ──────────────────────────────
  const map = L.map('map').setView([18.44, 77.45], 10);
  L.tileLayer('https://cartocdn-gusc.global.ssl.fastly.net/opmbuilder/api/v1/map/named/opm-mars-basemap-v0-2/all/{z}/{x}/{y}.png',
    {attribution:'OpenPlanetary · NASA', maxZoom:12}).addTo(map);

  // ── 환경 → 생체 연결 함수 (핵심) ──────────
  function computeVitals(s){
    // s = { slope(°), load(kg), elapsedMin, solarEvent(bool) }
    const HR_rest = 70, O2_rest = 0.5, RAD_day = 0.64; // 기준값 (조정 가능)
    const I = 0.3 + 0.02*s.slope + 0.008*s.load;            // 운동 강도
    let HR = HR_rest + 70*I + (s.solarEvent ? 15 : 0);      // 심박
    HR = Math.min(Math.round(HR), 185);
    const O2 = +(O2_rest + 1.4*I).toFixed(2);               // 산소 소모율
    let dose = (s.elapsedMin/1440)*RAD_day;                 // 누적 피폭
    if(s.solarEvent) dose += 1.2;                           // SPE 가산
    dose = +dose.toFixed(2);
    const warn = [];
    if(HR >= 160) warn.push('심박 과부하');
    if(O2 >= 2.2) warn.push('산소 소모 과다');
    if(dose >= 1.0) warn.push('피폭 경고');
    return { HR, O2, dose, warn };
  }

  // ── 슬라이더 → 함수 호출 → 화면 갱신 ──────
  function render(){
    const s = {
      slope: +slope.value, load: +load.value,
      elapsedMin: +elap.value, solarEvent: solar.checked
    };
    slopeV.textContent = s.slope; loadV.textContent = s.load; elapV.textContent = s.elapsedMin;
    const v = computeVitals(s);
    hr.textContent = v.HR; o2.textContent = v.O2; dose.textContent = v.dose;
    const w = document.getElementById('warn');
    w.textContent = v.warn.length ? '⚠ ' + v.warn.join(' · ') : '✓ 정상';
    w.className = v.warn.length ? 'warn' : 'warn ok';
  }
  ['slope','load','elap','solar'].forEach(id =>
    document.getElementById(id).addEventListener('input', render));
  render();
</script>
</body>
</html>

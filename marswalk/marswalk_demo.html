<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>MARSWALK — 통합 데모</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="data/spots.js"></script>
<style>
  html,body{height:100%;margin:0;font-family:sans-serif}
  #map{height:100%}
  #panel{position:absolute;top:10px;right:10px;z-index:1000;width:250px;
         background:rgba(16,16,24,.94);color:#eee;padding:13px 15px;border-radius:11px;font-size:13px}
  #status{text-align:center;font-size:19px;font-weight:800;padding:7px;border-radius:7px;margin-bottom:10px;background:#152}
  .stat{display:flex;justify-content:space-between;font-size:13px;margin:4px 0}
  .bar{height:15px;border-radius:4px;background:#222;overflow:hidden;margin:2px 0 9px}
  .fill{height:100%;transition:width .3s,background .3s}
  #panel label{display:block;margin:8px 0 1px;color:#9a9}
  #panel input[type=range]{width:100%}
  button{background:#2b6;border:0;color:#042;font-weight:700;padding:7px 13px;border-radius:6px;cursor:pointer;margin:9px 4px 0 0}
  button.pause{background:#c54;color:#fff}
  .hint{position:absolute;bottom:10px;left:10px;z-index:1000;background:rgba(16,16,24,.9);color:#ccc;
        padding:8px 12px;border-radius:8px;font-size:12px;max-width:260px}
  .pop b{color:#111}
  .pop img{width:200px;border-radius:6px;display:block;margin:5px 0}
  .pop button{background:#185fa5;color:#fff;font-size:12px;padding:5px 10px}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="status">목적지를 골라요</div>
  <div class="stat">🫙 산소 <span id="o2p">100</span>%</div><div class="bar"><div class="fill" id="o2bar" style="width:100%;background:#4af"></div></div>
  <div class="stat">💪 체력 <span id="stam">100</span>%</div><div class="bar"><div class="fill" id="stambar" style="width:100%;background:#6c6"></div></div>
  <div class="stat">☢️ 피폭 <span id="dose">0.00</span> mSv</div><div class="bar"><div class="fill" id="dosebar" style="width:0%;background:#fa3"></div></div>
  <div class="stat">❤️ 심박 <span id="hr">70</span> bpm · 🎯 <span id="dname">–</span></div>
  <label>지형 경사: <span id="slopeV">8</span>°</label><input type="range" id="slope" min="0" max="25" value="8">
  <label>적재 무게: <span id="loadV">20</span> kg</label><input type="range" id="load" min="0" max="50" value="20">
  <button id="go">▶ EVA 시작</button><button id="reset" class="pause">⟳ 리셋</button>
</div>
<div class="hint">핀 클릭 → 실사·생명점수 확인 → "목적지로" → ▶ 시작.<br>걸을수록 산소↓ 복귀반경(초록원)↓ — 원이 대원을 지나치면 자동 복귀.</div>

<script>
  const BASE=[18.44,77.45];
  const map=L.map('map').setView(BASE,12);
  L.tileLayer('https://cartocdn-gusc.global.ssl.fastly.net/opmbuilder/api/v1/map/named/opm-mars-basemap-v0-2/all/{z}/{x}/{y}.png',
    {attribution:'OpenPlanetary · NASA',maxZoom:14}).addTo(map);

  // 기지 + 복귀 반경
  L.circleMarker(BASE,{radius:8,color:'#fff',fillColor:'#3af',fillOpacity:1,weight:2}).addTo(map).bindTooltip('기지',{permanent:true,direction:'top'});
  const ring=L.circle(BASE,{radius:2000,color:'#5c6',fillColor:'#5c6',fillOpacity:0.1,weight:2}).addTo(map);
  const astro=L.circleMarker(BASE,{radius:7,color:'#fff',fillColor:'#e33',fillOpacity:1,weight:2}).addTo(map).bindTooltip('대원',{permanent:true,direction:'bottom'});

  // 탐사 지점 = data/spots.js 에서 읽음 (데이터와 로직 분리, 더블클릭 OK)
  let target=null;
  if (typeof SPOTS !== 'undefined' && SPOTS.length) buildPins();
  else document.getElementById('status').textContent='⚠ data/spots.js 없음';

  function buildPins(){
    SPOTS.forEach(s=>{
      const col = s.score>=80?'#2a7':s.score>=65?'#ca3':'#a55';
      L.circleMarker([s.lat,s.lon],{radius:9,color:'#fff',fillColor:col,fillOpacity:.9,weight:2}).addTo(map)
        .bindPopup(`<div class="pop"><b>${s.name}</b><br>생명점수 <b>${s.score}</b>/100<br>`+
          `<img src="${s.img}" alt="실사"><span style="font-size:11px;color:#555">${s.note||'실제 Perseverance'}</span><br>`+
          `<button onclick="setTarget('${s.name}')">목적지로</button></div>`);
    });
  }
  window.setTarget=n=>{ target=SPOTS.find(s=>s.name===n); set('dname',n); map.closePopup();
    document.getElementById('status').textContent='▶ 눌러 출발'; };

  // ── 모델 ──
  const M=80, VO2ABS=3.0, ETA=2.0, GMARS=0.38, O2W=1/348, SUSTAIN=0.35, HR_REST=70, HRMAX=186;
  const TANK=500, RAD_DAY=0.64, MAXWB=2000;
  const pandolf=(L,v,G)=>1.5*M+2*(M+L)*Math.pow(L/M,2)+ETA*(M+L)*(1.5*v*v+0.35*v*G*GMARS);

  let o2=TANK, stam=100, dose=0, walked=0, returning=false, timer=null;
  const v=i=>+document.getElementById(i).value, set=(i,x)=>document.getElementById(i).textContent=x;
  const bar=(i,p,c)=>{const e=document.getElementById(i);e.style.width=Math.max(0,p)+'%';e.style.background=c;};

  function lerp(a,b,t){return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];}

  function step(){
    if(!target){return;}
    const slope=v('slope'), load=v('load'), speed=1.0, G=Math.tan(slope*Math.PI/180)*100;
    const total=map.distance(BASE,[target.lat,target.lon]);
    // 이동 (왕복)
    walked += (returning?-1:1)*speed*3*2;   // 1틱≈진행
    if(walked>=Math.min(total, MAXWB*(o2/TANK))) returning=true;
    if(walked<=0){walked=0; returning=false; if(o2<TANK*0.99){stop(); set('status-done','');}}
    const frac=Math.min(walked/total,1);
    astro.setLatLng(lerp(BASE,[target.lat,target.lon],frac));

    // 자원
    const burn=pandolf(load,speed,returning?0:G)*O2W;   // 복귀는 내리막(평지 보수)
    o2-=burn*3; if(o2<0)o2=0;
    const pct=burn/VO2ABS;
    let hr=Math.min(Math.round(HR_REST+(HRMAX-HR_REST)*pct),HRMAX);
    dose += (RAD_DAY/1440)*3;
    stam += (pct>SUSTAIN?-14*(pct-SUSTAIN):8*(SUSTAIN-pct))*1;
    stam=Math.min(Math.max(stam,0),100);

    // 복귀 반경
    const radius=Math.round(o2/TANK*MAXWB);
    ring.setRadius(radius);
    const distBase=walked;
    let st,bg;
    if(o2<=0){st='🛑 산소 고갈';bg='#722';stop();}
    else if(distBase>radius){st='🔴 복귀 한계!';bg='#722';returning=true;}
    else if(distBase>radius*0.8){st='🟡 복귀선 근접';bg='#650';}
    else {st= returning?'↩ 복귀 중':'🟢 전진 여유';bg='#152';}
    ring.setStyle({color:distBase>radius?'#e55':'#5c6',fillColor:distBase>radius?'#e55':'#5c6'});

    document.getElementById('status').textContent=st;
    document.getElementById('status').style.background=bg;
    set('o2p',Math.round(o2/TANK*100)); set('stam',Math.round(stam)); set('dose',dose.toFixed(2)); set('hr',hr);
    set('slopeV',slope); set('loadV',load);
    bar('o2bar',o2/TANK*100, o2<TANK*.25?'#e55':'#4af');
    bar('stambar',stam, stam<25?'#e55':'#6c6');
    bar('dosebar',Math.min(dose/2*100,100), dose>=1?'#e55':'#fa3');
  }
  function stop(){clearInterval(timer);timer=null;go.textContent='▶ 재개';go.classList.remove('pause');}
  const go=document.getElementById('go');
  go.onclick=()=>{ if(!target){document.getElementById('status').textContent='먼저 목적지 선택!';return;}
    if(timer){stop();} else {timer=setInterval(step,600);go.textContent='⏸ 정지';go.classList.add('pause');} };
  document.getElementById('reset').onclick=()=>{stop();o2=TANK;stam=100;dose=0;walked=0;returning=false;
    astro.setLatLng(BASE);ring.setRadius(2000);ring.setStyle({color:'#5c6',fillColor:'#5c6'});
    set('o2p',100);set('stam',100);set('dose','0.00');set('hr',70);
    bar('o2bar',100,'#4af');bar('stambar',100,'#6c6');bar('dosebar',0,'#fa3');
    document.getElementById('status').textContent='목적지를 골라요';document.getElementById('status').style.background='#152';};
</script>
</body>
</html>

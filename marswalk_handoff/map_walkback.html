<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>MARSWALK 지도 — 복귀 반경</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
  html,body{height:100%;margin:0;font-family:sans-serif}
  #map{height:100%}
  #panel{position:absolute;top:12px;right:12px;z-index:1000;background:rgba(20,20,28,.93);
         color:#eee;padding:14px 16px;border-radius:10px;width:235px;font-size:13px}
  #panel label{display:block;margin:8px 0 2px;color:#aaa}
  #panel input[type=range]{width:100%}
  .stat{display:flex;justify-content:space-between;margin:5px 0}
  .big{font-size:18px;font-weight:700}
  #status{text-align:center;font-size:20px;font-weight:800;margin:8px 0;padding:6px;border-radius:6px}
  button{background:#2b6;border:0;color:#042;font-weight:700;padding:7px 14px;border-radius:6px;cursor:pointer;margin:6px 4px 0 0}
  button.pause{background:#c54;color:#fff}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="status">–</div>
  <div class="stat">🫙 산소 <span><span id="o2p">100</span>%</span></div>
  <div class="stat">↩ 복귀 반경 <span class="big" id="rad">–</span>m</div>
  <div class="stat">📍 기지까지 <span id="dist2">800</span>m</div>
  <label>기지까지 거리: <span id="distV">800</span> m</label>
  <input type="range" id="dist" min="300" max="1900" value="800" step="50">
  <label>지형 경사: <span id="slopeV">8</span>°</label>
  <input type="range" id="slope" min="0" max="25" value="8">
  <label>적재 무게: <span id="loadV">20</span> kg</label>
  <input type="range" id="load" min="0" max="50" value="20">
  <button id="go">▶ EVA 시작</button>
  <button id="reset" class="pause">⟳ 리셋</button>
</div>

<script>
  const BASE=[18.44,77.45];
  const map=L.map('map').setView(BASE,12);
  L.tileLayer('https://cartocdn-gusc.global.ssl.fastly.net/opmbuilder/api/v1/map/named/opm-mars-basemap-v0-2/all/{z}/{x}/{y}.png',
    {attribution:'OpenPlanetary · NASA',maxZoom:14}).addTo(map);

  L.circleMarker(BASE,{radius:8,color:'#fff',fillColor:'#3af',fillOpacity:1,weight:2}).addTo(map).bindTooltip('기지',{permanent:true,direction:'top'});
  const astro=L.circleMarker(BASE,{radius:7,color:'#fff',fillColor:'#c33',fillOpacity:1,weight:2}).addTo(map).bindTooltip('대원',{permanent:true,direction:'bottom'});
  const ring=L.circle(BASE,{radius:2000,color:'#5c6',fillColor:'#5c6',fillOpacity:0.12,weight:2}).addTo(map);

  const MAXWB=2000, TANK=500, GMARS=0.38, ETA=2.0, M_BODY=80;
  let o2=TANK, timer=null;
  const pandolf=(L,v,G)=>1.5*M_BODY+2*(M_BODY+L)*Math.pow(L/M_BODY,2)+ETA*(M_BODY+L)*(1.5*v*v+0.35*v*G*GMARS);
  const astroLL=d=>[18.44, 77.45 + d/(111000*0.949)]; // 기지서 동쪽으로 d미터

  function step(){
    const slope=+v('slope'), load=+v('load'), dist=+v('dist'), speed=0.9;
    const G=Math.tan(slope*Math.PI/180)*100;
    const burn=pandolf(load,speed,G)/348;   // L/min (경사·무게↑ → 소모↑)
    o2-=burn*3; if(o2<0)o2=0;                // 1틱 = 3분

    const frac=o2/TANK, radius=Math.round(frac*MAXWB);  // 복귀 반경 = 남은산소 × 최대반경(2km)
    astro.setLatLng(astroLL(dist));
    ring.setRadius(radius);
    const safe = dist<=radius;
    ring.setStyle({color:safe?'#5c6':'#e55', fillColor:safe?'#5c6':'#e55'});

    set('o2p',Math.round(frac*100)); set('rad',radius); set('dist2',dist);
    set('distV',dist); set('slopeV',slope); set('loadV',load);
    const st=document.getElementById('status');
    if(o2<=0){ st.textContent='🛑 산소 고갈'; st.style.background='#722'; stop(); }
    else if(!safe){ st.textContent='🔴 지금 복귀!'; st.style.background='#722'; }
    else if(dist>radius*0.8){ st.textContent='🟡 복귀선 근접'; st.style.background='#650'; }
    else { st.textContent='🟢 여유'; st.style.background='#152'; }
  }
  function v(i){return document.getElementById(i).value}
  function set(i,x){document.getElementById(i).textContent=x}
  function stop(){clearInterval(timer);timer=null;go.textContent='▶ 재개';go.classList.remove('pause')}
  const go=document.getElementById('go');
  go.onclick=()=>{ if(timer){stop();} else {timer=setInterval(step,600);go.textContent='⏸ 정지';go.classList.add('pause');} };
  document.getElementById('reset').onclick=()=>{stop();o2=TANK;step();};
  ['dist','slope','load'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{if(!timer)step()}));
  step();
</script>
</body>
</html>
